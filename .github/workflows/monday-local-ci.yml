name: Monday Local CI

on:
  pull_request:
    paths:
      - ".gitignore"
      - "README.md"
      - "docs/**"
      - "contracts/**"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "packages/**"
      - "scripts/**"
      - "runtime-artifacts/README.md"
      - ".github/workflows/monday-local-ci.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  monday-local-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          npm install -g pnpm@10
          pnpm install --frozen-lockfile

      - name: Validate handoff mapping smoke
        run: |
          mkdir -p /tmp/monday
          python3 scripts/validate_handoff_mapping.py \
            --run-id "ci-${{ github.run_id }}-handoff" \
            --output /tmp/monday/handoff-smoke-report.json
          python3 scripts/validate_runtime_evidence.py \
            --kind handoff \
            --report /tmp/monday/handoff-smoke-report.json \
            --output /tmp/monday/handoff-validation-report.json

      - name: Run planningops handoff integration smoke
        run: |
          mkdir -p /tmp/monday
          python3 scripts/integrate_planningops_handoff.py \
            --run-id "ci-${{ github.run_id }}" \
            --handoff-report /tmp/monday/handoff-smoke-report.json \
            --queue-out /tmp/monday/queue.from-planningops.json \
            --scheduler-report /tmp/monday/scheduler-run-report.json \
            --integration-report /tmp/monday/planningops-handoff-report.json \
            --idempotency /tmp/monday/idempotency.json \
            --transition-log /tmp/monday/scheduler.ndjson
          python3 scripts/validate_runtime_evidence.py \
            --kind scheduler \
            --report /tmp/monday/scheduler-run-report.json \
            --output /tmp/monday/scheduler-validation-report.json
          python3 scripts/validate_runtime_evidence.py \
            --kind integration \
            --report /tmp/monday/planningops-handoff-report.json \
            --output /tmp/monday/integration-validation-report.json

      - name: Validate contract pin
        run: |
          mkdir -p /tmp/monday
          python3 scripts/validate_contract_pin.py \
            --output /tmp/monday/contract-pin-report.json

      - name: Verify topology README contract
        run: bash scripts/test_module_readmes.sh

      - name: Verify mission-file local runtime smoke contract
        run: bash scripts/test_local_runtime_smoke_mission_file.sh

      - name: Verify operator channel delivery CLI contract
        run: bash scripts/test_operator_channel_delivery_cli.sh

      - name: Verify supervisor status update CLI contract
        run: bash scripts/test_supervisor_status_update_cli.sh

      - name: Verify supervisor goal completion CLI contract
        run: bash scripts/test_supervisor_goal_completion_cli.sh

      - name: Verify scheduler queue runtime ADR contract
        run: bash scripts/test_scheduler_queue_runtime_adr.sh

      - name: Verify runtime queue store baseline
        run: bash scripts/test_runtime_queue_store.sh

      - name: Verify SQLite-backed scheduled queue cycle
        run: bash scripts/test_run_scheduled_queue_cycle_store.sh

      - name: Verify worker outcome lifecycle
        run: bash scripts/test_record_queue_worker_outcome.sh

      - name: Verify runtime integration guardrails
        run: bash scripts/test_runtime_guardrails.sh

      - name: Seeded failure guard for contract pin
        run: bash scripts/test_contract_pin_validation.sh
